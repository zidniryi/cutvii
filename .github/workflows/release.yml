name: Release

# Push a tag like v1.0.0 to build installers for macOS (Apple Silicon + Intel), Windows and Linux and attach
# them to a DRAFT GitHub release. Review the draft, then publish it. The builds are not code-signed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: macOS (Apple Silicon),
              os: macos-latest,
              args: "--target aarch64-apple-darwin",
              rust: aarch64-apple-darwin,
              ffmpeg: macos-arm64,
            }
          - {
              name: macOS (Intel),
              os: macos-15-intel,
              args: "--target x86_64-apple-darwin",
              rust: x86_64-apple-darwin,
              ffmpeg: macos-x64,
            }
          - { name: Linux, os: ubuntu-24.04, args: "", rust: "", ffmpeg: linux-x64 }
          - { name: Windows, os: windows-latest, args: "", rust: "", ffmpeg: windows-x64 }

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: pnpm install --frozen-lockfile

      # The installer carries its own FFmpeg (GPL build, see docs/licensing.md), checked against a pinned SHA-256
      - uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ matrix.ffmpeg }}-${{ hashFiles('config/ffmpeg-binaries.json') }}
      - run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.ffmpeg }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CutVii ${{ github.ref_name }}
          releaseBody: See the assets below to download CutVii. Builds are not code-signed yet.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
