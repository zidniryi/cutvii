name: Release

# Push a tag like v1.0.0 to build installers for macOS (Apple Silicon), Windows and Linux and attach
# them to a DRAFT GitHub release. Review the draft, then publish it. The builds are not code-signed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # No macOS Intel build: ONNX Runtime (the `ort` crate, used by upscale and voice-over) has no prebuilt
      # library for x86_64-apple-darwin.
      matrix:
        include:
          - {
              name: macOS (Apple Silicon),
              os: macos-latest,
              args: "--target aarch64-apple-darwin",
              rust: aarch64-apple-darwin,
              ffmpeg: macos-arm64,
            }
          - { name: Linux, os: ubuntu-24.04, args: "", rust: "", ffmpeg: linux-x64 }
          - { name: Windows, os: windows-latest, args: "", rust: "", ffmpeg: windows-x64 }

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
          # the AppImage bundles GStreamer from this machine (bundleMediaFramework): without these it has no H.264 / AAC decoder
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-gl

      - run: pnpm install --frozen-lockfile

      # The installer carries its own FFmpeg (GPL build, see docs/licensing.md), checked against a pinned SHA-256
      - uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ matrix.ffmpeg }}-${{ hashFiles('config/ffmpeg-binaries.json') }}
      - run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.ffmpeg }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CutVii ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your system below. FFmpeg is included.

            **These builds are not code-signed yet**, so your system will warn you the first time:
            - **macOS:** if it says CutVii is "damaged", open Terminal and run `xattr -cr /Applications/CutVii.app` once, then open it again.
            - **Windows:** if SmartScreen blocks it, click "More info", then "Run anyway".
            - **Linux:** `chmod +x CutVii*.AppImage`, then run it (or install the `.deb`).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
