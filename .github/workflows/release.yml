name: Release

# Push a tag like v1.0.0 to build installers for macOS (Apple Silicon + Intel), Windows and Linux and attach
# them to a DRAFT GitHub release. Review the draft, then publish it. The builds are not code-signed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple Silicon), os: macos-latest, args: "--target aarch64-apple-darwin", rust: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-13, args: "--target x86_64-apple-darwin", rust: x86_64-apple-darwin }
          - { name: Linux, os: ubuntu-22.04, args: "", rust: "" }
          - { name: Windows, os: windows-latest, args: "", rust: "" }

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CutVii ${{ github.ref_name }}
          releaseBody: See the assets below to download CutVii. Builds are not code-signed yet.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
