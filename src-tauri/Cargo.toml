[package]
name = "cutvii"
version = "0.1.0"
description = "CutVii — open-source desktop video editor"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cutvii_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
png = "0.18.1"
whisper-rs = "0.16"
ureq = "3"
sha2 = "0.11.0"
# ONNX Runtime (MIT), for AI upscale. The runtime library is fetched at build time; models never are.
ort = "=2.0.0-rc.13"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Speech recognition uses the GPU through Metal on macOS; elsewhere it runs on the CPU.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

# Text drawing, PNG encoding and font parsing live in dependencies; unoptimised they make every text edit in
# `tauri dev` visibly slow. Dependencies are optimised in dev builds too (our own code stays quick to compile).
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
